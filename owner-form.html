<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نموذج عرض الوحدة — رصف للاستثمار</title>
<meta name="description" content="نموذج لأصحاب العقارات الراغبين بعرض وحدتهم للتأجير مع رصف للاستثمار.">
<style>
@font-face{font-family:"ThmanyahSans";src:url(assets/fonts/sans-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"ThmanyahSans";src:url(assets/fonts/sans-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"ThmanyahSans";src:url(assets/fonts/sans-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"ThmanyahDisplay";src:url(assets/fonts/display-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--brown:#473530;--tan:#CEB69F;--cream:#FAF0E6;--ink:#211E1B;--beige:#E2DBD3;--taupe:#89817D;--card:#FFFDF9;--good:#2E7D5B;--good-bg:#E7F3EC;--bad:#B84F3E}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"ThmanyahSans",Tahoma,sans-serif;font-size:16px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
.top{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.top img{height:48px;width:auto}
h1{font-family:"ThmanyahDisplay","ThmanyahSans",serif;font-size:28px;margin:0;color:var(--brown);line-height:1.3}
.sub{color:var(--taupe);font-size:14.5px;max-width:520px;margin:10px 0 26px}
form{background:var(--card);border:1px solid var(--beige);border-radius:16px;padding:22px 20px;box-shadow:0 10px 30px -18px rgba(43,36,32,.25)}
fieldset{border:none;padding:0;margin:0 0 22px}
legend{font-family:"ThmanyahDisplay","ThmanyahSans",serif;font-weight:700;font-size:16px;color:var(--brown);margin-bottom:12px;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
label{font-size:12px;font-weight:700;color:var(--taupe)}
input,select,textarea{border:1px solid var(--beige);border-radius:9px;padding:9px 11px;font-size:14px;font-family:inherit;background:var(--cream);color:var(--ink)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--tan)}
textarea{resize:vertical;min-height:64px;grid-column:1/-1}
.full{grid-column:1/-1}
.file-field{border:1.5px dashed var(--beige);border-radius:10px;padding:12px;background:var(--cream)}
.file-field label{display:block;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--taupe);margin-top:4px}
button{width:100%;margin-top:6px;background:var(--brown);color:var(--cream);border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
button:hover{opacity:.92}
button:disabled{opacity:.6;cursor:default}
#done{display:none;text-align:center;background:var(--good-bg);color:var(--good);border:1px solid var(--good);border-radius:16px;padding:32px 20px;font-size:15px;line-height:1.9}
#err{display:none;color:var(--bad);font-size:13px;margin-top:12px;text-align:center}
@media (max-width:480px){h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="assets/logo.png" alt="رصف للاستثمار"></div>
  <h1>نموذج عرض الوحدة</h1>
  <p class="sub">عبّئ بيانات وحدتك أدناه ليتواصل معك فريقنا ويبدأ إجراءات التأجير.</p>

  <form id="offerForm">
    <fieldset>
      <legend>بيانات المالك</legend>
      <div class="grid">
        <div class="field"><label>الاسم</label><input name="ownerName" required></div>
        <div class="field"><label>رقم الجوال</label><input name="ownerPhone" required></div>
        <div class="field"><label>رقم الهوية</label><input name="ownerNationalId"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>بيانات الوحدة</legend>
      <div class="grid">
        <div class="field"><label>المشروع</label><input name="project" required></div>
        <div class="field"><label>رقم الوحدة</label><input name="unitNumber" required></div>
        <div class="field"><label>الدور</label><input name="floor"></div>
        <div class="field"><label>الموقع (واجهة/زاوية...)</label><input name="position"></div>
        <div class="field"><label>نوع الموقف</label><input name="parkingType"></div>
        <div class="field">
          <label>قفل الموقف</label>
          <select name="parkingLock"><option value="">—</option><option value="نعم">نعم</option><option value="لا">لا</option></select>
        </div>
        <div class="field"><label>المساحة (م²)</label><input name="area" type="number" step="0.01"></div>
        <div class="field"><label>مساحة الجزء الخاص (م²)</label><input name="privatePartArea" type="number" step="0.01"></div>
        <div class="field"><label>التجهيز</label><input name="furnishing" placeholder="مؤثثة / راكب / بدون"></div>
        <div class="field"><label>التجهيزات المرَكَّبة</label><input name="appliancesInstalled"></div>
        <div class="field"><label>رقم العداد</label><input name="meterNumber"></div>
        <div class="field"><label>رقم حساب الكهرباء</label><input name="electricityAccount"></div>
        <div class="field"><label>رمز القفل الذكي</label><input name="secretCode"></div>
        <div class="field full"><label>رابط الموقع (خرائط)</label><input name="mapUrl" type="url"></div>
        <div class="field full"><textarea name="description" placeholder="وصف الوحدة (عدد الغرف، الصالة، المرافق...)"></textarea></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>السعر</legend>
      <div class="grid">
        <div class="field"><label>الإيجار السنوي (دفعة واحدة)</label><input name="rentSingle" type="number"></div>
        <div class="field"><label>الإيجار السنوي (دفعتين)</label><input name="rentTwo" type="number"></div>
        <div class="field"><label>رسوم اتحاد الملاك</label><input name="hoaFee" type="number"></div>
        <div class="field"><label>رسوم إضافية</label><input name="extraFees" type="number"></div>
        <div class="field"><label>مبلغ التأمين</label><input name="insuranceAmount" type="number"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>المستندات</legend>
      <div class="grid">
        <div class="file-field">
          <label>صورة صك الملكية</label>
          <input type="file" name="deedFile" accept="image/*,.pdf">
        </div>
        <div class="file-field">
          <label>صورة الهوية الوطنية</label>
          <input type="file" name="idFile" accept="image/*,.pdf">
        </div>
      </div>
      <p class="hint">هذه المستندات تُستخدم فقط للتحقق من الملكية، ولا تظهر في أي مكان عام.</p>
    </fieldset>

    <fieldset>
      <legend>ملاحظات إضافية</legend>
      <textarea name="notes" class="full" placeholder="أي تفاصيل أخرى تحب إضافتها"></textarea>
    </fieldset>

    <button type="submit" id="submitBtn">إرسال النموذج</button>
    <div id="err"></div>
  </form>

  <div id="done">
    ✅ تم استلام بياناتك بنجاح.<br>سيراجع فريقنا الطلب ويتواصل معك قريباً.
  </div>
</div>

<script>
const SUPABASE_URL = "https://zptwbcauxyqqhimujzok.supabase.co";
const SUPABASE_KEY = "sb_publishable_nSe3I9vtJ9PNUCSXAC7gLQ_U-vv0os9";

const form = document.getElementById('offerForm');
const btn = document.getElementById('submitBtn');
const err = document.getElementById('err');

const params = new URLSearchParams(location.search);
if (params.get('phone')) form.ownerPhone.value = params.get('phone');

async function uploadFile(file, prefix, submissionId) {
  if (!file) return null;
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const path = `${submissionId}/${prefix}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/owner-uploads/${path}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': file.type || 'application/octet-stream',
    },
    body: file,
  });
  if (!res.ok) throw new Error('file upload failed');
  return path;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true; btn.textContent = '...جارٍ الإرسال';
  err.style.display = 'none';

  try {
    const fd = new FormData(form);
    const deedFile = fd.get('deedFile');
    const idFile = fd.get('idFile');
    fd.delete('deedFile'); fd.delete('idFile');

    const data = Object.fromEntries(fd.entries());
    ['area', 'privatePartArea', 'rentSingle', 'rentTwo', 'hoaFee', 'extraFees', 'insuranceAmount'].forEach(k => {
      if (data[k] === '') delete data[k]; else if (data[k] != null) data[k] = Number(data[k]);
    });

    const submissionId = crypto.randomUUID();
    const [deedPath, idPath] = await Promise.all([
      uploadFile(deedFile && deedFile.size ? deedFile : null, 'deed', submissionId),
      uploadFile(idFile && idFile.size ? idFile : null, 'id', submissionId),
    ]);

    const res = await fetch(`${SUPABASE_URL}/rest/v1/owner_submissions`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify({
        id: submissionId,
        data,
        deed_file_path: deedPath,
        id_file_path: idPath,
      }),
    });
    if (!res.ok) throw new Error('فشل الإرسال');

    form.style.display = 'none';
    document.getElementById('done').style.display = 'block';
  } catch (ex) {
    err.textContent = 'تعذّر إرسال النموذج — تأكد من الاتصال وأعد المحاولة.';
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'إرسال النموذج';
  }
});
</script>
</body>
</html>
